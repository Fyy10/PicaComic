name: Build Linux
run-name: Build Linux

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  Build_Linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.pub-cache
          key: ${{ runner.os }}-amd64-pub-cache-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-amd64-pub-cache

      - run: |
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 wget libfuse2
      - run: |
          flutter build linux --release
          mkdir -p PicaComic.AppDir/usr/bin
          mkdir -p PicaComic.AppDir/usr/share/applications
          mkdir -p PicaComic.AppDir/usr/share/icons
          cp linux/res/* PicaComic.AppDir/
          chmod +x PicaComic.AppDir/AppRun
          cp -r build/linux/x64/release/bundle/* PicaComic.AppDir/usr/bin/
          mv PicaComic.AppDir/usr/bin/pica_comic PicaComic.AppDir/usr/bin/PicaComic
          chmod +x PicaComic.AppDir/usr/bin/PicaComic

      - run: |
          wget "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage PicaComic.AppDir PicaComic.AppImage
          chmod +x PicaComic.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: PicaComic-linux-x86_64
          path: PicaComic.AppImage
